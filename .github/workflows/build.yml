name: CI/CD Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE != '' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Test and build arm64-v8a release
        run: ./gradlew testStandardDebugUnitTest assembleStandardRelease -PtargetAbi=arm64-v8a

      # This is a test key only, never an official publishing credential. Reuse it between runs
      # so CI-signed installations can update while this cache is retained.
      - name: Restore CI test signing key
        if: env.HAS_RELEASE_KEYSTORE == 'false'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mpvex-ci-signing
          key: mpvex-ci-test-signing-v1

      - name: Sign and verify arm64-v8a release
        id: sign
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          RELEASE_DIR="app/build/outputs/apk/standard/release"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("app/build/outputs/apk/standard/release")
          elements = json.loads((root / "output-metadata.json").read_text())["elements"]
          assert len(elements) == 1, "Expected exactly one release APK"
          assert elements[0]["filters"] == [{"filterType": "ABI", "value": "arm64-v8a"}], elements
          assert len(list(root.glob("*.apk"))) == 1, "Unexpected extra APK outputs"
          PY
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          KEYSTORE="$RUNNER_TEMP/mpvex-release.keystore"
          trap 'rm -f "$KEYSTORE"' EXIT
          if [[ -n "$SIGNING_KEYSTORE" ]]; then
            : "${SIGNING_KEY_ALIAS:?Missing SIGNING_KEY_ALIAS}"
            : "${SIGNING_STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD}"
            : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"
            printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$KEYSTORE"
            echo "signing=repository-signed" >> "$GITHUB_OUTPUT"
          else
            CI_KEY="$RUNNER_TEMP/mpvex-ci-signing/keystore.jks"
            mkdir -p "$(dirname "$CI_KEY")"
            if [[ ! -f "$CI_KEY" ]]; then
              keytool -genkeypair -noprompt -keystore "$CI_KEY" -storetype JKS \
                -alias mpvex-ci -storepass android -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=mpvEx CI Test, O=mpvEx, C=US"
            fi
            cp "$CI_KEY" "$KEYSTORE"
            export SIGNING_KEY_ALIAS=mpvex-ci SIGNING_STORE_PASSWORD=android KEY_PASSWORD=android
            echo "signing=ci-test-signed" >> "$GITHUB_OUTPUT"
            echo "CI test signature: cannot update an installation signed with the official key." >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p "$RELEASE_DIR/signed"
          APK="$RELEASE_DIR/signed/app-standard-arm64-v8a-release.apk"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$APK" "$RELEASE_DIR/app-standard-arm64-v8a-release-unsigned.apk"
          "$APKSIGNER" verify --verbose "$APK"
          echo "### arm64-v8a Release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "$(basename "$APK"): $(stat -c%s "$APK") bytes; signature verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed arm64-v8a release APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvEx-arm64-v8a-release-${{ steps.sign.outputs.signing }}-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/signed/app-standard-arm64-v8a-release.apk
          if-no-files-found: error
