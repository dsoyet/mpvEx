name: CI/CD Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Test thumbnail logic
        run: ./gradlew testStandardDebugUnitTest

      - name: Build release APKs
        run: ./gradlew assembleStandardRelease

      # The existing debug build type signs automatically and uses the existing .debug suffix.
      # Provide an installable test build without changing release signing or requiring secrets.
      - name: Build installable debug APKs
        run: ./gradlew assembleStandardDebug

      - name: Verify debug APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          shopt -s nullglob
          apks=(app/build/outputs/apk/standard/debug/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Upload installable debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpvEx-installable-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned release APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpvEx-standard-release-unsigned-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error
