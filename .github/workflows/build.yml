name: CI/CD Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE != '' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Test and build arm64-v8a release
        run: |
          ./gradlew testStandardDebugUnitTest assembleStandardRelease -PtargetAbi=arm64-v8a
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path("app/build/test-results/testStandardDebugUnitTest").glob("TEST-*.xml"))
          assert reports, "No unit test reports found"
          roots = [ET.parse(path).getroot() for path in reports]
          counts = {key: sum(int(root.attrib.get(key, 0)) for root in roots) for key in ("tests", "failures", "errors", "skipped")}
          assert counts["tests"] > 0 and counts["failures"] == 0 and counts["errors"] == 0, counts
          summary = "Unit tests: " + ", ".join(f"{key}={value}" for key, value in counts.items())
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary + "\n")
          PY

      - name: Sign and verify arm64-v8a release
        id: sign
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          RELEASE_DIR="app/build/outputs/apk/standard/release"
          VERSION=$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          root = Path("app/build/outputs/apk/standard/release")
          metadata = json.loads((root / "output-metadata.json").read_text())
          assert metadata["applicationId"] == "app.mpv.personal", metadata["applicationId"]
          elements = metadata["elements"]
          assert len(elements) == 1, "Expected exactly one release APK"
          assert elements[0]["filters"] == [{"filterType": "ABI", "value": "arm64-v8a"}], elements
          assert len(list(root.glob("*.apk"))) == 1, "Unexpected extra APK outputs"
          version = elements[0]["versionName"]
          assert re.fullmatch(r"[A-Za-z0-9._-]+", version), version
          print(version)
          PY
          )
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          KEYSTORE="$RUNNER_TEMP/mpvex-release.keystore"
          trap 'rm -f "$KEYSTORE"' EXIT
          if [[ -n "$SIGNING_KEYSTORE" ]]; then
            : "${SIGNING_KEY_ALIAS:?Missing SIGNING_KEY_ALIAS}"
            : "${SIGNING_STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD}"
            : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"
            printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$KEYSTORE"
            echo "signing=repository-signed" >> "$GITHUB_OUTPUT"
          else
            # Ephemeral test key: never upload or cache a keystore.
            keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storetype JKS \
              -alias mpvex-ci -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=mpvEx CI Test, O=mpvEx, C=US"
            export SIGNING_KEY_ALIAS=mpvex-ci SIGNING_STORE_PASSWORD=android KEY_PASSWORD=android
            echo "signing=ci-test-signed" >> "$GITHUB_OUTPUT"
            echo "CI test signature: temporary key; cannot update official or previous CI-signed installations." >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p "$RELEASE_DIR/signed"
          APK="$RELEASE_DIR/signed/Mpv-${VERSION}-arm64-v8a.apk"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$APK" "$RELEASE_DIR/app-standard-arm64-v8a-release-unsigned.apk"
          "$APKSIGNER" verify --verbose "$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          BADGING=$("$(dirname "$APKSIGNER")/aapt2" dump badging "$APK")
          printf '%s\n' "$BADGING" | sed -n '1,8p'
          grep -q "package: name='app.mpv.personal'" <<< "$BADGING"
          grep -q "application-label:'Mpv'" <<< "$BADGING"
          MANIFEST=$("$(dirname "$APKSIGNER")/aapt2" dump xmltree "$APK" --file AndroidManifest.xml)
          grep -q 'app.mpv.personal.provider' <<< "$MANIFEST"
          grep -q 'app.mpv.personal.networkstreaming' <<< "$MANIFEST"
          grep -q 'app.marlboroadvance.mpvex.App' <<< "$MANIFEST"
          grep -q 'app.marlboroadvance.mpvex.ui.player.PlayerActivity' <<< "$MANIFEST"
          echo "### arm64-v8a Release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "$(basename "$APK"): $(stat -c%s "$APK") bytes; signature verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed arm64-v8a release APK
        uses: actions/upload-artifact@v4
        with:
          name: Mpv-Android
          path: ${{ steps.sign.outputs.apk_path }}
          if-no-files-found: error
